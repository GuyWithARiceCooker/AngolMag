name: Deploy AngolMag web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore binary assets
        run: |
          find . -name '*.png.b64' -not -path './.git/*' | while read -r f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'

      - run: flutter pub get

      - run: flutter build web --release --base-href /AngolMag/

      - name: Pages extras
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: Try to enable Pages from gh-pages (may need manual step)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || \
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || true
